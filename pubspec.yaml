name: ahmad_ramsi_portfolio
description: "Personal portfolio of Dhiya' Ulhaq Ahmad Ramsi — mobile developer (Flutter & Kotlin)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  pretty_qr_code: ^3.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Flutter only bundles files directly inside a listed directory, so each
    # app's screenshot folder needs its own entry.
    - assets/icons/
    - assets/screenshots/
    - assets/screenshots/cma-stock/
    - assets/screenshots/focustime/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/google_fonts/PlusJakartaSans-ExtraLight.ttf
          weight: 200
        - asset: assets/google_fonts/PlusJakartaSans-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/google_fonts/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/google_fonts/PlusJakartaSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/google_fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/PlusJakartaSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/google_fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/PlusJakartaSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/google_fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/PlusJakartaSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/google_fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/PlusJakartaSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/google_fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/google_fonts/PlusJakartaSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
